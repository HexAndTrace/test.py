name: Run Python Script

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ] # Triggers on push to the main branch
  pull_request:
    branches: [ "main" ] # Triggers on pull requests to the main branch
  workflow_dispatch:     # Allows you to manually click "Run workflow" in GitHub

jobs:
  run-test-script:
    runs-on: ubuntu-latest # Uses a standard, free Linux runner

    steps:
      # Step 1: Check out your repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Specify your preferred Python version

      # Step 3: Run your python script
      - name: Execute test.py
        run: python test.py
